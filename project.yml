name: ScreenBrightness
options:
  bundleIdPrefix: com.jespermol
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: 9WFDLY652Y
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Developer ID Application"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES

targets:
  ScreenBrightness:
    type: application
    platform: macOS
    sources:
      - ScreenBrightness
    dependencies:
      - target: ScreenBrightnessControls
    info:
      path: ScreenBrightness/Info.plist
      properties:
        # Lets the app and the controls extension find their shared app group.
        AppGroupTeamPrefix: $(TeamIdentifierPrefix)
    entitlements:
      path: ScreenBrightness/ScreenBrightness.entitlements
      properties:
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.jespermol.ScreenBrightness
        # Sunrise and sunset for the schedule.
        com.apple.security.personal-information.location: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jespermol.ScreenBrightness
        PRODUCT_NAME: ScreenBrightness
        INFOPLIST_KEY_NSLocationUsageDescription: Your approximate location is used to work out sunrise and sunset for the brightness schedule.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Your approximate location is used to work out sunrise and sunset for the brightness schedule.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Screen Brightness
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
    scheme:
      testTargets:
        - ScreenBrightnessTests

  # Control Center and menu bar controls. They hand their commands to the app.
  ScreenBrightnessControls:
    type: app-extension
    platform: macOS
    sources:
      - Controls
      - ScreenBrightness/SharedIntents.swift
      - ScreenBrightness/SharedStore.swift
      - ScreenBrightness/Preset.swift
      - ScreenBrightness/BrightnessLevel.swift
    info:
      path: Controls/Info.plist
      properties:
        CFBundleDisplayName: Screen Brightness
        AppGroupTeamPrefix: $(TeamIdentifierPrefix)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Controls/Controls.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(TeamIdentifierPrefix)com.jespermol.ScreenBrightness
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jespermol.ScreenBrightness.Controls
        PRODUCT_NAME: Controls
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) CONTROLS_EXTENSION
        SKIP_INSTALL: YES

  # Unit tests for the pure logic. They compile those files directly instead of loading the app,
  # so running them never touches the monitor or installs event taps.
  ScreenBrightnessTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - ScreenBrightness/DDCProtocol.swift
      - ScreenBrightness/BrightnessLevel.swift
      - ScreenBrightness/MonitorCapabilities.swift
      - ScreenBrightness/Preset.swift
      - ScreenBrightness/Hotkeys.swift
      - ScreenBrightness/Schedule.swift
      - ScreenBrightness/SharedStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jespermol.ScreenBrightnessTests
        GENERATE_INFOPLIST_FILE: YES
